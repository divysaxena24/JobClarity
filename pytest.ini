[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers --tb=short
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests for API routes and end-to-end flows
    ml: Machine learning pipeline and artifact tests
    regression: Regression and schema contract tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
